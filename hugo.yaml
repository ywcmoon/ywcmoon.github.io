baseURL: "https://ywcmoon.github.io/"
title: "ywcmoon 的博客"
locale: "zh-CN"
defaultContentLanguage: "zh-cn"
theme: "PaperMod"

languages:
  zh-cn:
    label: "简体中文"
    locale: "zh-CN"
    weight: 1

enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

# 首页额外输出 JSON，供本地搜索（Fuse.js）生成索引
outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40

params:
  env: production
  author: "ywcmoon"
  description: "记录学习笔记、技术实践与日常思考"

  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowRssButtonInSectionTermList: true

  # 主题模式：light / dark / auto（跟随系统）
  defaultTheme: "auto"
  # 启用本地搜索
  ShowSearch: true

  homeInfoParams:
    Title: "你好，我是 ywcmoon"
    Content: >
      这里记录我的学习笔记、技术实践与日常思考。

  socialIcons:
    - name: github
      url: "https://github.com/ywcmoon"
    - name: rss
      url: "index.xml"
